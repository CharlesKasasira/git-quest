<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title description">
  <title id="title">Git Quest</title>
  <desc id="description">A glowing Git branch on a dark archive tile</desc>
  <defs>
    <linearGradient id="tile" x1="8" y1="5" x2="56" y2="59" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0c1b27" />
      <stop offset="1" stop-color="#03070c" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#tile)" stroke="#1d4653" stroke-width="2" />
  <g fill="none" stroke="#73ff9f" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" filter="url(#glow)">
    <path d="M23 17v30" />
    <path d="M25.5 31h9.5c7 0 10-4 10-10v-4" />
  </g>
  <g fill="#071018" stroke-width="4">
    <circle cx="23" cy="15" r="6" stroke="#73ff9f" />
    <circle cx="23" cy="49" r="6" stroke="#73ff9f" />
    <circle cx="45" cy="15" r="6" stroke="#55e6ff" />
  </g>
</svg>
